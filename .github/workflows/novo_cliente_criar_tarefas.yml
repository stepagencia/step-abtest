name: Novo cliente — criar tarefas automáticas

on:
  schedule:
    - cron: "0 9 * * *"  # Roda todo dia às 9h UTC (6h SP)
  workflow_dispatch:       # Permite rodar manualmente pelo GitHub
    inputs:
      dry_run:
        description: "Rodar em modo DRY_RUN (só loga, não escreve)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      limit:
        description: "LIMIT: processa só os N primeiros especialistas (vazio = todos)"
        required: false
        default: ""

jobs:
  automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests

      - name: Executar automação
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          CLICKUP_PLANEJAMENTO_LIST_ID: ${{ secrets.CLICKUP_PLANEJAMENTO_LIST_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          LIMIT: ${{ github.event.inputs.limit || '' }}
        run: python novo_cliente_criar_tarefas.py
